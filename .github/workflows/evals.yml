name: evals
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          cache-dependency-glob: pyproject.toml
      - run: uv venv && uv pip install -e ".[dev]"
      - name: unit tests
        run: .venv/bin/pytest -q
      - name: shipped example suites validate clean
        run: |
          .venv/bin/evalkit validate \
            examples/offline_demo.yaml \
            examples/support_triage.yaml \
            examples/regression_v1.yaml \
            examples/regression_v2.yaml \
            examples/local_model.yaml \
            examples/unpriced_model.yaml

      - name: validator catches a broken suite
        run: |
          if .venv/bin/evalkit validate examples/broken_suite.yaml; then
            echo "::error::validator passed a suite with 9 known errors"; exit 1
          fi
          if .venv/bin/evalkit run examples/broken_suite.yaml; then
            echo "::error::run started despite suite errors"; exit 1
          fi
          echo "validator correctly blocked the broken suite"

      - name: offline eval smoke test
        run: .venv/bin/evalkit run examples/offline_demo.yaml

      - name: custom endpoint against a live local server
        run: |
          python3 tests/fake_openai_server.py 8731 &
          for i in $(seq 1 20); do
            curl -sf -o /dev/null -X POST http://127.0.0.1:8731/v1/chat/completions \
              -H 'content-type: application/json' \
              -d '{"model":"m","messages":[{"role":"user","content":"ping"}]}' && break
            sleep 0.25
          done
          .venv/bin/evalkit run examples/local_model.yaml \
            --base-url http://127.0.0.1:8731/v1

      - name: pricing table freshness
        run: .venv/bin/python scripts/check_pricing_freshness.py --max-age-days 60

      - name: unpriced models fail closed
        run: |
          if .venv/bin/evalkit run examples/unpriced_model.yaml; then
            echo "::error::an unpriced model passed a cost gate"; exit 1
          fi
          echo "unpriced model correctly failed the cost assertion"
      - name: regression gate catches a cost blowup
        run: |
          .venv/bin/evalkit run examples/regression_v1.yaml --save /tmp/v1.json --no-fail-on-case -q
          .venv/bin/evalkit run examples/regression_v2.yaml --save /tmp/v2.json -q
          if .venv/bin/evalkit compare /tmp/v1.json /tmp/v2.json; then
            echo "::error::gate failed to catch a 10x cost increase"; exit 1
          fi
          echo "gate correctly blocked the cost regression"
