[project]
name = "evalkit"
version = "0.1.0"
description = "Prompt and agent evals with cost regression as a first-class failure."
readme = "Readme.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
evalkit = "evalkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalkit"]

[tool.hatch.build.targets.wheel.force-include]
"src/evalkit/data/pricing.json" = "evalkit/data/pricing.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
